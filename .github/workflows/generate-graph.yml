name: Generate Graph

on:
  push:
    branches: [main]
    paths:
      - 'notes/**/*.md'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          npm install
          pip install pyyaml

      - name: Recalculate backlinks
        run: python3 scripts/backlinks_updater.py

      - name: Generate _graph.json
        run: node scripts/generate_graph.js

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _graph.json INDEX.md notes/
          git diff --staged --quiet || git commit -m "chore: regenerate _graph.json [skip ci]"
          git push
